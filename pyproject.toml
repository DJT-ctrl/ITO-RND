[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intotheopen-backend"
version = "0.1.0"
description = "IntoTheOpen LinkedIn post intelligence backend"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = [
  "agents*",
  "api*",
  "config*",
  "feedback*",
  "processors*",
  "scrapers*",
  "storage*",
  "telemetry*",
  "validation_pipeline*",
  "phase_10*",
  "post_mortems*",
  "trend_radar*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
