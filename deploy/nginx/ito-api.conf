# IntoTheOpen API — Nginx TLS edge (issue #14)
#
# Target shape after Certbot (HTTPS only for the API):
#   - :80  → ACME + 301 redirect to HTTPS
#   - :443 → TLS terminate → 127.0.0.1:8000
#
# Prefer: sudo bash deploy/nginx/install-tls.sh <domain> <email>
# which bootstraps HTTP, issues the cert, then installs this file.
#
# Manual:
#   sudo cp deploy/nginx/ito-api.conf /etc/nginx/conf.d/ito-api.conf
#   sudo sed -i 's/api.example.com/YOUR_HOSTNAME/g' /etc/nginx/conf.d/ito-api.conf
#   # only after certs exist under /etc/letsencrypt/live/YOUR_HOSTNAME/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
